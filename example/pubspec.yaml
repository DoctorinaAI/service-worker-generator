name: sw_example
description: "Service Worker Example"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

  fonts:
    # Declared so that the engine does not fetch Roboto from fonts.gstatic.com,
    # which the worker cannot cache: offline, all text would disappear.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: FontAwesome
      fonts:
        - asset: assets/fonts/fa-regular-400.ttf
          weight: 400

  shaders:
    - assets/shaders/shimmer.frag
