name: Checkout

on:
  workflow_dispatch:
    inputs:
      dart-version:
        description: "Dart SDK version to use"
        default: "stable"
        required: false
  push:
    branches:
      - "main"
      - "master"
    paths:
      - "bin/**.dart"
      - "lib/**.dart"
      - "lib/src/assets/**"
      - "test/**.dart"
      - "packages/sw/src/**"
      - "scripts/**"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
      - "pubspec.yaml"
      - "package.json"
      - "analysis_options.yaml"
      - "dart_test.yaml"
      - ".pubignore"
      - "package-lock.json"
      - "packages/sw/package.json"
      - "packages/sw/*.ts"
      - "packages/sw/tsconfig*.json"
      - "packages/sw/eslint.config.js"
      - "packages/sw/e2e/**"
      - "example/**"
  pull_request:
    branches:
      - "main"
      - "master"
      - "dev"
      - "develop"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
    paths:
      - "bin/**.dart"
      - "lib/**.dart"
      - "lib/src/assets/**"
      - "test/**.dart"
      - "packages/sw/src/**"
      - "scripts/**"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
      - "pubspec.yaml"
      - "package.json"
      - "analysis_options.yaml"
      - "dart_test.yaml"
      - ".pubignore"
      - "package-lock.json"
      - "packages/sw/package.json"
      - "packages/sw/*.ts"
      - "packages/sw/tsconfig*.json"
      - "packages/sw/eslint.config.js"
      - "packages/sw/e2e/**"
      - "example/**"

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: "TypeScript"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Type check
        run: npm run check

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Run tests
        run: npm test

      - name: 🏗️ Build artifacts
        timeout-minutes: 2
        run: npm run build

      - name: ✅ Verify committed assets match build output
        run: npm run verify

  checkout:
    name: "Dart"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    container:
      image: dart:${{ github.event.inputs.dart-version || 'stable' }}
    env:
      pub-cache: pub
      PUB_CACHE: /github/home/.pub-cache
    timeout-minutes: 10
    outputs:
      version: ${{ steps.setup.outputs.version }}
    concurrency:
      group: checkout-${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/

      - name: 🚂 Setup dependencies
        id: setup
        timeout-minutes: 5
        uses: ./.github/actions/setup
        with:
          pub-cache: packages

      - name: 🚦 Check code format
        id: check-format
        timeout-minutes: 1
        run: |
          find bin lib test -name "*.dart" ! -name "*.*.dart" -print0 | xargs -0 dart format --set-exit-if-changed --line-length 80 -o none bin/ lib/ test/

      - name: 📈 Check analyzer
        id: check-analyzer
        timeout-minutes: 1
        run: dart analyze --fatal-warnings lib/ bin/ test/

      - name: 🧪 Run unit tests
        id: run-unit-tests
        timeout-minutes: 5
        run: |
          dart test --color --platform=vm --concurrency=12 \
            --timeout=60s --reporter=github --file-reporter=json:reports/tests.json \
            --exclude-tags=integration \
            --coverage=coverage

      - name: 🔍 Check what would be published
        id: check-published-files
        timeout-minutes: 3
        # A .pubignore replaces the .gitignore of its own directory for
        # `pub publish`, so a rule forgotten there uploads credentials or
        # build output to pub.dev. This is the last line of defence, so it
        # runs last, on the whole tree: the setup action checks out only
        # what the Dart steps need, which leaves out .pubignore itself, and
        # the tests have created coverage/ and reports/ by now.
        run: |
          # The job runs in a container as another user than the checkout's
          # owner, and git refuses such a repository; pub reads .gitignore
          # through git as well.
          git config --global --add safe.directory "$PWD"
          git sparse-checkout disable
          if ! dart pub publish --dry-run > /tmp/publish-set.txt 2>&1; then
            cat /tmp/publish-set.txt
            echo "::error::dart pub publish --dry-run failed"
            exit 1
          fi
          sed -E 's/.*[├└]── //; s/ \([^)]*\)$//' /tmp/publish-set.txt |
            grep -iE '^([^ ]+\.(key|pem|p12|jks|keystore)|[^ ]+\.vm\.json|credentials\.json|service-account[^ ]*\.json|build|coverage|reports|node_modules)$' \
            > /tmp/leaked.txt || true
          if [ -s /tmp/leaked.txt ]; then
            echo "::error::Files that must never reach pub.dev are in the published set:"
            cat /tmp/leaked.txt
            echo "Add them to .pubignore - it replaces .gitignore for pub."
            exit 1
          fi
          echo "The published file set is clean."

  # What `environment.sdk` in pubspec.yaml claims, tested. The floor is
  # there so users on an older stable Flutter can install the package at
  # all, and a claim no job exercises is a guess.
  dart-oldest:
    name: "Dart (oldest supported SDK)"
    runs-on: ubuntu-latest
    container:
      image: dart:3.8
    env:
      PUB_CACHE: /github/home/.pub-cache
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Install dependencies
        # Without the flag, pub also resolves example/, which needs the
        # Flutter SDK this job does not have.
        run: dart pub get --no-example

      - name: 📈 Check analyzer
        run: dart analyze --fatal-warnings lib/ bin/ test/

      - name: 🧪 Run unit tests
        run: dart test --platform=vm --timeout=60s --exclude-tags=integration

  e2e:
    name: "E2E (Flutter + Playwright)"
    runs-on: ubuntu-24.04
    # The steps inside have their own budgets, which now add up past 20.
    timeout-minutes: 30
    needs: [typescript]
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install Node dependencies
        run: npm ci

      - name: 🧱 Build TS artifacts and copy into Dart assets
        timeout-minutes: 2
        run: npm run build:all

      - name: 🐦 Install Flutter example dependencies
        working-directory: example
        run: flutter pub get

      - name: 🏗️ Build Flutter example web
        working-directory: example
        run: flutter build web --release -o build/web

      - name: 🧪 Run Dart integration tests
        run: |
          dart pub get
          dart test --color --platform=vm --concurrency=12 \
            --timeout=120s --reporter=github --tags=integration

      - name: 🧰 Run Dart CLI on example build
        run: dart run sw:generate --input=example/build/web

      # Three engines are ~500 MB of download, which has taken longer than
      # the step's budget on a slow runner and failed the job with nothing
      # wrong in the code. Cached per Playwright version — the browser
      # revisions are pinned by it — and given room to download when the
      # cache misses.
      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 🎭 Install Playwright browsers
        working-directory: packages/sw
        timeout-minutes: 15
        # `--with-deps` installs the system libraries the engines need, which
        # the cache does not carry; on a hit the browsers themselves are
        # already in place and only those packages are installed.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 🧪 Run Playwright E2E
        working-directory: packages/sw
        timeout-minutes: 10
        env:
          SW_E2E_BROWSERS: all
        run: npx playwright test

      - name: 📤 Upload Playwright report
        # Always, not only on failure: a test that passed on a retry is
        # marked flaky there, with the trace of its retry.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: packages/sw/playwright-report
          retention-days: 7
