name: Deploy to Pub.dev

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  verify:
    # A tag publishes to pub.dev, so it must not get there without the same
    # checks a pull request passes: the type check and the unit tests of
    # both halves, the committed assets matching the TypeScript build, and
    # the published file set being free of credentials and build output.
    name: "Verify before publishing"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏷️ Check the tag against pubspec.yaml
        # A tag is what publishes, and nothing else compares the two: a
        # `0.4.1` tag on a tree whose pubspec still says `0.4.0` would
        # publish 0.4.0 again (or fail deep inside the publish job), and a
        # version missing from the CHANGELOG ships undocumented.
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          echo "pubspec: $version, ref: ${GITHUB_REF_NAME:-<none>}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version $version"
            exit 1
          fi
          grep -q "# $version" CHANGELOG.md || {
            echo "::error::Version $version is not in CHANGELOG.md"
            exit 1
          }

      - name: 🔍 Type check
        run: npm -w packages/sw run check

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Run TypeScript tests
        run: npm -w packages/sw run test

      - name: 🏗️ Build and verify
        run: npm run check:assets

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: 📥 Install Dart dependencies
        # Without the flag, pub also resolves example/, which needs the Flutter
        # SDK this job does not have.
        run: dart pub get --no-example

      - name: 🚦 Check code format
        run: dart format --set-exit-if-changed --line-length 80 -o none bin/ lib/ test/

      - name: 📈 Check analyzer
        run: dart analyze --fatal-warnings lib/ bin/ test/

      - name: 🧪 Run Dart unit tests
        # The CLI tests start a VM that compiles `bin/generate.dart` from
        # source; on a busy runner that can pass the default 30 s, and a
        # timeout here blocks the release until someone re-runs it.
        run: dart test --timeout=60s --exclude-tags=integration

      - name: 🔍 Check what would be published
        timeout-minutes: 3
        # The same leak check as checkout.yml: a .pubignore replaces the
        # .gitignore of its own directory for `pub publish`, so a rule
        # forgotten there uploads credentials or build output to pub.dev.
        # It runs last, on the tree the publish job will see plus everything
        # the steps above created (node_modules/, dist/, .dart_tool/). This
        # job does a full checkout on the runner as the checkout's owner, so
        # it needs neither `git sparse-checkout disable` nor safe.directory.
        run: |
          if ! dart pub publish --dry-run > /tmp/publish-set.txt 2>&1; then
            cat /tmp/publish-set.txt
            echo "::error::dart pub publish --dry-run failed"
            exit 1
          fi
          sed -E 's/.*[├└]── //; s/ \([^)]*\)$//' /tmp/publish-set.txt |
            grep -iE '^([^ ]+\.(key|pem|p12|jks|keystore)|[^ ]+\.vm\.json|credentials\.json|service-account[^ ]*\.json|build|coverage|reports|node_modules)$' \
            > /tmp/leaked.txt || true
          if [ -s /tmp/leaked.txt ]; then
            echo "::error::Files that must never reach pub.dev are in the published set:"
            cat /tmp/leaked.txt
            echo "Add them to .pubignore - it replaces .gitignore for pub."
            exit 1
          fi
          echo "The published file set is clean."

  verify-oldest:
    # `pubspec.yaml` claims Dart >=3.8, and `dart pub global activate sw`
    # compiles the package on whatever SDK the user has. A tag that never
    # went through `Checkout` — a hotfix pushed straight to a tag — would
    # otherwise be published without anything having compiled it on the
    # oldest SDK it promises to support.
    name: "Verify on the oldest supported SDK"
    runs-on: ubuntu-latest
    container:
      image: dart:3.8
    env:
      PUB_CACHE: /github/home/.pub-cache
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 📥 Install dependencies
        # Without the flag, pub also resolves example/, which needs the
        # Flutter SDK this job does not have.
        run: dart pub get --no-example

      - name: 📈 Check analyzer
        run: dart analyze --fatal-warnings lib/ bin/ test/

      - name: 🧪 Run unit tests
        run: dart test --platform=vm --timeout=60s --exclude-tags=integration

  deploy:
    name: "Deploy to Pub.dev"
    needs: [verify, verify-oldest]
    # Only a tag publishes. A manual run (`workflow_dispatch`) still
    # verifies, but skips the tag comparison, so it must not publish
    # whatever version its branch's pubspec happens to have.
    if: github.ref_type == 'tag'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
