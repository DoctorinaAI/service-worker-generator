name: Deploy example to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "bin/**.dart"
      - "lib/**.dart"
      - "lib/src/assets/**"
      - "example/**"
      - "pubspec.yaml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: 🏗️ Build Flutter example web
        working-directory: example
        # A project site lives under the repository's name, so the base href
        # has to say so, and it must end with a slash.
        run: |
          flutter pub get
          flutter build web --release --wasm \
            --base-href "/${{ github.event.repository.name }}/" -o build/pages

      - name: 🧰 Run Dart CLI on example build
        run: |
          dart pub get
          # Fonts at install, not on first fetch: a first visit runs before the
          # worker controls the page, and text without them is invisible.
          dart run sw:generate --input=example/build/pages \
            --required "assets/fonts/**;assets/assets/fonts/**"

      - name: 🧭 Answer deep links with the app
        # Pages has no rewrite rules: it answers an unknown path with 404.html
        # and a 404 status. Copied after generating, so it stays out of the
        # manifest. The first visit boots from it; after that the worker
        # answers the 404 from its cached shell.
        run: cp example/build/pages/index.html example/build/pages/404.html

      - name: 📤 Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: example/build/pages

  deploy:
    name: "Deploy"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
