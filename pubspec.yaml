# ==============================================================================
# PROJECT METADATA
# ==============================================================================

name: sw

description: >
  Generates a service worker and a bootstrap script for a Flutter Web
  build: per-category caching with integrity checks, a loading screen with
  real progress, CanvasKit from the CDN with a local fallback, and deploys
  that land as one coherent build. Replaces flutter_bootstrap.js.

version: 0.4.0

homepage: https://github.com/DoctorinaAI/service-worker-generator
repository: https://github.com/DoctorinaAI/service-worker-generator
issue_tracker: https://github.com/DoctorinaAI/service-worker-generator/issues

topics:
  - service-worker
  - generator
  - cli
  - web
  - flutter

platforms:
  linux:
  macos:
  windows:

# ==============================================================================
# PROJECT STRUCTURE
# ==============================================================================

# dart pub global activate --source path .
# dart run sw:generate
#
# The command is `sw`, not `generate`: `dart pub global activate` puts the
# key on PATH, and a binary called `generate` there belongs to nobody.
executables:
  sw: generate

# ==============================================================================
# DEPENDENCIES
# ==============================================================================

environment:
  # The floor is what CI actually tests (see the "Dart (oldest)" job), not
  # the newest SDK that happens to be installed: a constraint of 3.11 kept
  # every Flutter release before 3.41 from using the package at all, for
  # language features it does not use. Raise it only with a job to match.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  path: ^1.9.1
  args: ^2.7.0
  glob: ^2.1.3
  crypto: ^3.0.6
  yaml: ^3.1.3

dev_dependencies:
  lints: ">=6.0.0 <7.0.0"
  test: ^1.26.2
